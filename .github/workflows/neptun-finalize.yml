name: Finalize Neptun Client

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, 'Finalize Neptun Client') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply clean Neptun integration
        shell: bash
        run: |
          set -euo pipefail
          BASE=433c56f6b2d1392efadff1ac33d42468dc37144c
          git show "$BASE:src/engine/shared/config_variables.h" > src/engine/shared/config_variables.h
          git show "$BASE:src/game/client/components/menus.h" > src/game/client/components/menus.h
          git show "$BASE:src/game/client/components/menus_settings.cpp" > src/game/client/components/menus_settings.cpp

          python3 <<'PY'
          from pathlib import Path

          cfg = Path('src/engine/shared/config_variables.h')
          text = cfg.read_text()
          block = '''// NEPTUN_CLIENT_CONFIG_BEGIN
          MACRO_CONFIG_INT(ClNeptunEnabled, cl_neptun_enabled, 1, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "Enable Neptun Client training features")
          MACRO_CONFIG_INT(ClNeptunAutoHook, cl_neptun_auto_hook, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "Enable dummy auto-hook training mode")
          MACRO_CONFIG_INT(ClNeptunAimTraining, cl_neptun_aim_training, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "Enable aim-training HUD/assist mode for dummy training")
          MACRO_CONFIG_INT(ClNeptunSpeedProfile, cl_neptun_speed_profile, 100, 25, 300, CFGFLAG_CLIENT | CFGFLAG_SAVE, "Neptun movement profile value (training/config only)")
          MACRO_CONFIG_INT(ClNeptunQuick, cl_neptun_quick, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "Enable Neptun quick-movement training mode")
          MACRO_CONFIG_INT(ClNeptunMoonwalk, cl_neptun_moonwalk, 0, 0, 1, CFGFLAG_CLIENT | CFGFLAG_SAVE, "Enable Neptun moon-walk training mode")
          // NEPTUN_CLIENT_CONFIG_END

          '''.replace('          ', '')
          text = text.replace('// client\n', '// client\n' + block, 1)
          cfg.write_text(text)

          menus = Path('src/game/client/components/menus.h')
          text = menus.read_text()
          text = text.replace('\t\tSETTINGS_CREDITS,\n\n\t\tSETTINGS_LENGTH,', '\t\tSETTINGS_CREDITS,\n\t\tSETTINGS_NEPTUN,\n\n\t\tSETTINGS_LENGTH,', 1)
          text = text.replace('\tvoid RenderSettingsCredits(CUIRect MainView);', '\tvoid RenderSettingsCredits(CUIRect MainView);\n\n\t// found in menus_settings_neptun.cpp\n\tvoid RenderSettingsNeptun(CUIRect MainView);', 1)
          menus.write_text(text)

          settings = Path('src/game/client/components/menus_settings.cpp')
          text = settings.read_text()
          text = text.replace('\t\tLocalize("Assets"),\n\t\tLocalize("Credits")};', '\t\tLocalize("Assets"),\n\t\tLocalize("Credits"),\n\t\t"Neptun"};', 1)
          text = text.replace('''\telse if(g_Config.m_UiSettingsPage == SETTINGS_CREDITS)
\t{
\t\tGameClient()->m_MenuBackground.ChangePosition(CMenuBackground::POS_SETTINGS_CREDITS);
\t\tRenderSettingsCredits(MainView);
\t}
\telse''', '''\telse if(g_Config.m_UiSettingsPage == SETTINGS_CREDITS)
\t{
\t\tGameClient()->m_MenuBackground.ChangePosition(CMenuBackground::POS_SETTINGS_CREDITS);
\t\tRenderSettingsCredits(MainView);
\t}
\telse if(g_Config.m_UiSettingsPage == SETTINGS_NEPTUN)
\t{
\t\tRenderSettingsNeptun(MainView);
\t}
\telse''', 1)
          settings.write_text(text)

          Path('src/game/client/components/menus_settings_neptun.cpp').write_text('''#include "menus.h"

#include <game/client/ui.h>

void CMenus::RenderSettingsNeptun(CUIRect MainView)
{
\tCUIRect Button, Left, Right, Label;
\tMainView.HSplitTop(32.0f, &Label, &MainView);
\tUi()->DoLabel(&Label, "Neptun Client", 24.0f, TEXTALIGN_ML);
\tMainView.HSplitTop(12.0f, nullptr, &MainView);
\tMainView.VSplitMid(&Left, &Right, 20.0f);

\tLeft.HSplitTop(30.0f, &Button, &Left);
\tif(DoButton_CheckBox(&g_Config.m_ClNeptunEnabled, "Enable Neptun training", g_Config.m_ClNeptunEnabled, &Button))
\t\tg_Config.m_ClNeptunEnabled ^= 1;

\tLeft.HSplitTop(30.0f, &Button, &Left);
\tif(DoButton_CheckBox(&g_Config.m_ClNeptunAutoHook, "Dummy auto-hook (training)", g_Config.m_ClNeptunAutoHook, &Button))
\t{
\t\tg_Config.m_ClNeptunAutoHook ^= 1;
\t\tg_Config.m_ClDummyControl = g_Config.m_ClNeptunAutoHook;
\t\tg_Config.m_ClDummyHook = g_Config.m_ClNeptunAutoHook;
\t}

\tLeft.HSplitTop(30.0f, &Button, &Left);
\tif(DoButton_CheckBox(&g_Config.m_ClNeptunAimTraining, "Aim training HUD/assist", g_Config.m_ClNeptunAimTraining, &Button))
\t\tg_Config.m_ClNeptunAimTraining ^= 1;

\tRight.HSplitTop(30.0f, &Button, &Right);
\tUi()->DoScrollbarOption(&g_Config.m_ClNeptunSpeedProfile, &g_Config.m_ClNeptunSpeedProfile, &Button, "Speed profile", 25, 300, &CUi::ms_LinearScrollbarScale, CUi::SCROLLBAR_OPTION_NOCLAMPVALUE);

\tRight.HSplitTop(30.0f, &Button, &Right);
\tif(DoButton_CheckBox(&g_Config.m_ClNeptunQuick, "Quick movement training", g_Config.m_ClNeptunQuick, &Button))
\t\tg_Config.m_ClNeptunQuick ^= 1;

\tRight.HSplitTop(30.0f, &Button, &Right);
\tif(DoButton_CheckBox(&g_Config.m_ClNeptunMoonwalk, "Moon-walk training", g_Config.m_ClNeptunMoonwalk, &Button))
\t\tg_Config.m_ClNeptunMoonwalk ^= 1;
}
''')

          Path('NEPTUN_CLIENT.md').write_text('''# Neptun Client

Neptun is a DDNet-derived client customization focused on local dummy and movement training.

## Included
- Neptun settings tab.
- Dummy auto-hook training toggle using DDNet dummy controls.
- Aim-training HUD/assist configuration toggle for local training.
- Configurable 25–300 movement profile value.
- Quick movement and moon-walk training toggles.

The training settings are client-side. No server-side speed manipulation or real-player auto-targeting is included.
''')
          PY

          clang-format -i src/game/client/components/menus_settings_neptun.cpp
          rm -f NEPTUN_PATCH_TRIGGER.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/shared/config_variables.h src/game/client/components/menus.h src/game/client/components/menus_settings.cpp src/game/client/components/menus_settings_neptun.cpp NEPTUN_CLIENT.md NEPTUN_PATCH_TRIGGER.txt
          git commit -m "Finalize Neptun Client"
          git push
